name: Publish maimai DXTag
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      execute:
        description: 补齐缺失曲目并更新全曲库版；默认只列出缺失
        type: boolean
        default: false
      refresh:
        description: 重算并覆盖当前曲库全部评分；需同时开启 execute
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: resource-dxtag
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'schedule' || vars.RESOURCE_SCHEDULES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: S3_BUCKET_MAIMAI
    timeout-minutes: 360
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check publication branch
        if: github.event_name == 'schedule' || inputs.execute
        run: test "$GITHUB_REF" = refs/heads/master
      - uses: actions/checkout@v6
        if: github.event_name == 'schedule' || inputs.execute
        with:
          repository: kckc7887/DXTag
          ref: 41e70ba6d3ed59e446751b6c9062692641ef3e15
          path: DXTag
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install 'boto3>=1.40,<2' 'paramiko>=5,<6' 'requests>=2.32,<3'
      - uses: actions/setup-node@v6
        if: github.event_name == 'schedule' || inputs.execute
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: DXTag/package-lock.json
      - name: Build DXTag
        if: github.event_name == 'schedule' || inputs.execute
        working-directory: DXTag
        run: npm ci && npm run build
      - name: Fill missing DXTag charts and publish full library
        id: publish
        continue-on-error: true
        env:
          EXECUTE: ${{ github.event_name == 'schedule' || inputs.execute }}
          REFRESH: ${{ inputs.refresh }}
          DXTAG_ROOT: ${{ github.workspace }}/DXTag
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          SFTP_ENDPOINT: ${{ secrets.SFTP_ENDPOINT }}
          SFTP_HOST_KEY: ${{ secrets.SFTP_HOST_KEY }}
        run: |
          args=()
          if [ "$EXECUTE" = true ]; then args+=(--execute); fi
          if [ "$REFRESH" = true ]; then args+=(--refresh); fi
          python -m publisher dxtag --output work/dxtag "${args[@]}"
      - name: Fail invalid DXTag publications
        if: steps.publish.outcome == 'failure' && steps.publish.outputs.cloud_fallback != 'true'
        run: exit 1
      - uses: actions/upload-artifact@v7
        if: steps.publish.outputs.cloud_fallback == 'true'
        with:
          name: dxtag-prepared-${{ github.run_attempt }}
          path: |
            work/dxtag/plan.json
            work/dxtag/payload
          if-no-files-found: error
          retention-days: 3
      - name: Retry prepared DXTag uploads through Yunxiao
        if: steps.publish.outputs.cloud_fallback == 'true'
        env:
          PUBLICATION_ATTEMPT: ${{ github.run_attempt }}
          YUNXIAO_ENDPOINT: ${{ vars.YUNXIAO_ENDPOINT }}
          YUNXIAO_MAIMAI_PIPELINE_ID: ${{ vars.YUNXIAO_MAIMAI_PIPELINE_ID }}
          YUNXIAO_TOKEN: ${{ secrets.YUNXIAO_TOKEN }}
        run: python -m publisher.yunxiao dispatch dxtag --attempt "$PUBLICATION_ATTEMPT" --timeout-minutes 120
